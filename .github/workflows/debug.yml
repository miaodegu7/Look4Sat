name: Android debug APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libtool-bin pkg-config
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_HOME}/cmdline-tools/bin/sdkmanager"; fi
          "$SDKMANAGER" "ndk;28.0.13004108"
      - name: Build bundled Hamlib for Android USB
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          bash scripts/build-hamlib-android.sh
      - name: Upload Hamlib source and notices
        uses: actions/upload-artifact@v4
        with:
          name: hamlib-4.7.2-source
          path: build/hamlib-source.tar.gz
      - name: Build debug APK and run domain tests
        run: bash ./gradlew :app:assembleDebug :core:domain:test --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: look4sat-hamlib-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/domain/build/reports/tests/
          if-no-files-found: ignore
